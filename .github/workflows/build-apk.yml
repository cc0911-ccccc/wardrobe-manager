name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: 关闭分析上报
        run: flutter config --no-analytics

      - name: 接受 Android SDK 许可
        run: yes | flutter doctor --android-licenses || true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 APK
        run: flutter build apk --release

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 发布 APK 到下载页
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5-build${{ github.run_number }}
          name: 衣橱管家 修复版 (第 ${{ github.run_number }} 次构建)
          body: |
            修复版「衣橱管家」，手动管理衣橱功能已全部打通。

            **已修复内容**
            - 添加衣服：改为手动填写（分类/类型/颜色/品牌/尺码/位置/季节/风格/备注），不再强制走失效的 AI
            - 首页按钮：拍照添加、找衣服已接通真实功能
            - 衣物详情：编辑、今天穿了 可用
            - 衣橱页：筛选、搜索、删除、编辑 全部连通
            - 穿搭记录：记录今天 可用

            **安装说明**
            下载下方 app-release.apk，传到手机安装即可。
            安装时如提示「未知来源应用」，选择允许。
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
